<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Panditji Dairy | Agent Delivery Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f4f1; color: #143525; }
    .card { background: #ffffff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(20,53,37,0.06); border: 1px solid #dce8e0; }
    .btn-deliver { background: #165636; color: #ffffff; font-weight: 700; border-radius: 10px; padding: 10px 14px; transition: 0.15s; }
    .btn-deliver:active { transform: scale(0.98); background: #0f3d26; }
    .bubble { border: 1.5px solid #a3c4b0; border-radius: 8px; width: 38px; height: 38px; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 14px; background: white; cursor: pointer; }
    .bubble.active { background: #165636; color: white; border-color: #165636; }
    .date-nav-btn { background: #1e5a3c; color: white; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .date-nav-btn:hover { background: #28734e; }
    .date-nav-btn.active { background: #ffffff; color: #165636; }
  </style>
</head>
<body class="pb-16">

<!-- LOGIN SCREEN (DEFAULT PIN 1234) -->
<div id="loginScreen" class="fixed inset-0 bg-[#123826] z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
    <div class="w-14 h-14 mx-auto rounded-xl bg-emerald-100 flex items-center justify-center font-black text-2xl text-emerald-800 border-2 border-emerald-300">
      PJ
    </div>
    <div>
      <h2 class="text-xl font-bold text-gray-900">Agent Portal Login</h2>
      <p class="text-xs text-gray-500 mt-1">Panditji Dairy Farm · Doorstep Delivery App</p>
    </div>

    <form onsubmit="handleAgentLogin(event)" class="space-y-3 text-left">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Mobile Number</label>
        <input type="tel" id="loginPhone" required placeholder="Enter 10-digit mobile" pattern="[0-9]{10}" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:border-emerald-600 focus:outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Passcode / PIN</label>
        <input type="password" id="loginPin" required placeholder="Default PIN: 1234" value="1234" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:border-emerald-600 focus:outline-none text-center font-bold tracking-widest text-lg">
        <p class="text-[11px] text-gray-400 mt-1 text-center">Default PIN for all agents is <b>1234</b></p>
      </div>

      <p id="loginError" class="text-xs text-red-600 font-bold hidden text-center"></p>

      <button type="submit" class="w-full bg-[#165636] hover:bg-[#114028] text-white font-bold py-3 rounded-xl text-sm shadow-md transition">
        Unlock Delivery Route
      </button>
    </form>
  </div>
</div>

<!-- AGENT APP DASHBOARD -->
<div id="appContainer" class="hidden">
  <header class="bg-[#123826] text-white px-4 py-3 sticky top-0 z-30 shadow-md">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center font-bold text-emerald-300 border border-emerald-400/30 text-sm">PJ</div>
        <div>
          <h1 class="text-sm font-bold tracking-tight" id="headerAgentName">Agent Runner</h1>
          <p class="text-[11px] text-emerald-200" id="headerAgentPhone">Logged In</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="syncWithCloud()" class="w-8 h-8 rounded-lg bg-[#1b4e36] flex items-center justify-center text-xs" title="Sync Cloud">🔄</button>
        <button onclick="handleLogout()" class="text-xs bg-red-900/60 hover:bg-red-800 text-red-200 px-2.5 py-1.5 rounded-lg border border-red-500/30 font-semibold">Logout</button>
      </div>
    </div>

    <!-- Date Navigation Tabs -->
    <div class="flex items-center justify-between mt-3 pt-2 border-t border-emerald-900/40 text-xs">
      <button class="date-nav-btn" onclick="changeDateOffset(-1)">◀ Previous</button>
      <div class="text-center font-bold text-emerald-100" id="currentViewDateLabel">Today</div>
      <button class="date-nav-btn" onclick="changeDateOffset(1)">Next Day ▶</button>
    </div>
  </header>

  <!-- View Mode Notice Banner -->
  <div id="readOnlyNotice" class="hidden px-4 py-2 text-xs font-bold text-center border-b"></div>

  <!-- Search & Fast Filters -->
  <div class="p-3 space-y-3 max-w-lg mx-auto">
    <div class="flex gap-2">
      <input type="text" id="runnerSearch" placeholder="🔍 Search H.No, Name, Phone..." class="flex-1 bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-600" oninput="renderStops()">
      <select id="shiftFilter" class="bg-white border border-gray-300 rounded-lg px-2 py-2 text-xs font-semibold" onchange="renderStops()">
        <option value="ALL">All Shifts</option>
        <option value="Morning" selected>Morning</option>
        <option value="Evening">Evening</option>
      </select>
    </div>

    <!-- Agent Summary Metrics -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white p-2.5 rounded-xl border border-gray-200 text-center">
        <div class="text-[10px] uppercase font-bold text-gray-500">Stops</div>
        <div id="statTotal" class="text-lg font-black text-[#143525]">0</div>
      </div>
      <div class="bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 text-center">
        <div class="text-[10px] uppercase font-bold text-emerald-800">Delivered</div>
        <div id="statDone" class="text-lg font-black text-emerald-700">0</div>
      </div>
      <div class="bg-blue-50 p-2.5 rounded-xl border border-blue-200 text-center">
        <div class="text-[10px] uppercase font-bold text-blue-800">Bottles Recd</div>
        <div id="statBottles" class="text-lg font-black text-blue-700">0</div>
      </div>
    </div>

    <!-- Stops List -->
    <div id="agentStopsContainer" class="space-y-3"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const todayStr = () => new Date().toISOString().slice(0, 10);
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');

const DEFAULT_SB_URL = 'https://nvqszaywblhdxhlhiuxp.supabase.co';
const DEFAULT_SB_KEY = 'sb_publishable_Pkn8vXc6unUaY2ZPTFf9Rg_LZwu3GDm';

let db = JSON.parse(localStorage.getItem('pjf_admin_ops') || JSON.stringify({
  agents: [
    { id: 'a1', name: 'Agent 1', phone: '9876543210', pin: '1234' },
    { id: 'a2', name: 'Agent 2', phone: '9876543211', pin: '1234' },
    { id: 'a3', name: 'Agent 3', phone: '9876543212', pin: '1234' }
  ],
  customers: [],
  deliveries: [],
  bottles: [],
  invoices: []
}));

let currentAgent = null;
let selectedDateOffset = 0;

function getTargetDateStr() {
  const d = new Date();
  d.setDate(d.getDate() + selectedDateOffset);
  return d.toISOString().slice(0, 10);
}

function checkExistingSession() {
  const saved = localStorage.getItem('pjf_agent_session');
  if (saved) {
    try {
      currentAgent = JSON.parse(saved);
      launchAgentApp();
      return;
    } catch(e) {}
  }
  $('loginScreen').classList.remove('hidden');
  $('appContainer').classList.add('hidden');
}

function handleAgentLogin(e) {
  e.preventDefault();
  const phone = $('loginPhone').value.trim();
  const pin = $('loginPin').value.trim();
  const errEl = $('loginError');

  const agentsList = db.agents || [
    { id: 'a1', name: 'Agent 1', phone: '9876543210', pin: '1234' },
    { id: 'a2', name: 'Agent 2', phone: '9876543211', pin: '1234' },
    { id: 'a3', name: 'Agent 3', phone: '9876543212', pin: '1234' }
  ];

  let match = agentsList.find(a => String(a.phone).trim() === phone);

  if (!match) {
    if (phone === '9876543210') match = { id: 'a1', name: 'Agent 1', phone: phone, pin: '1234' };
    else if (phone === '9876543211') match = { id: 'a2', name: 'Agent 2', phone: phone, pin: '1234' };
    else if (phone === '9876543212') match = { id: 'a3', name: 'Agent 3', phone: phone, pin: '1234' };
  }

  if (!match) {
    errEl.textContent = 'Mobile number not found in Agent Register. Contact Admin.';
    errEl.classList.remove('hidden');
    return;
  }

  const expectedPin = match.pin || '1234';
  if (pin !== expectedPin && pin !== '1234') {
    errEl.textContent = 'Incorrect Passcode / PIN. Default is 1234.';
    errEl.classList.remove('hidden');
    return;
  }

  currentAgent = match;
  localStorage.setItem('pjf_agent_session', JSON.stringify(currentAgent));
  launchAgentApp();
}

function handleLogout() {
  if (confirm('Log out from Agent Portal?')) {
    localStorage.removeItem('pjf_agent_session');
    currentAgent = null;
    $('loginScreen').classList.remove('hidden');
    $('appContainer').classList.add('hidden');
    $('loginPhone').value = '';
    $('loginPin').value = '1234';
    $('loginError').classList.add('hidden');
  }
}

function launchAgentApp() {
  $('loginScreen').classList.add('hidden');
  $('appContainer').classList.remove('hidden');
  $('headerAgentName').textContent = currentAgent.name;
  $('headerAgentPhone').textContent = `📞 ${currentAgent.phone}`;
  selectedDateOffset = 0;
  updateDateHeader();
  renderStops();
  syncWithCloud(true);
}

function changeDateOffset(delta) {
  selectedDateOffset += delta;
  updateDateHeader();
  renderStops();
}

function updateDateHeader() {
  const targetDate = getTargetDateStr();
  const d = new Date(targetDate + 'T00:00:00');
  const dateFormatted = d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  const notice = $('readOnlyNotice');

  if (selectedDateOffset === 0) {
    $('currentViewDateLabel').innerHTML = `📅 Today (${dateFormatted})`;
    notice.classList.add('hidden');
  } else if (selectedDateOffset < 0) {
    const daysAgo = Math.abs(selectedDateOffset);
    $('currentViewDateLabel').innerHTML = `⏪ ${daysAgo === 1 ? 'Yesterday' : daysAgo + ' days ago'} (${dateFormatted})`;
    notice.className = 'px-4 py-2 text-xs font-bold text-center bg-gray-200 text-gray-700 border-b border-gray-300';
    notice.textContent = '🔒 Viewing Past Record (Read-Only Mode). No delivery actions allowed.';
    notice.classList.remove('hidden');
  } else {
    const daysAhead = selectedDateOffset;
    $('currentViewDateLabel').innerHTML = `⏩ ${daysAhead === 1 ? 'Tomorrow' : 'In ' + daysAhead + ' days'} (${dateFormatted})`;
    notice.className = 'px-4 py-2 text-xs font-bold text-center bg-amber-100 text-amber-900 border-b border-amber-300';
    notice.textContent = '⏳ Upcoming Preview (Read-Only). Delivery actions unlock on scheduled date.';
    notice.classList.remove('hidden');
  }
}

function save() {
  localStorage.setItem('pjf_admin_ops', JSON.stringify(db));
  renderStops();
  syncWithCloud(true);
}

function setQuickBottles(delId, count) {
  if (selectedDateOffset !== 0) return;
  const d = (db.deliveries || []).find(x => x.id === delId);
  if (d) {
    d.bottlesReturned = Number(count);
    renderStops();
  }
}

function setManualBottles(delId, val) {
  if (selectedDateOffset !== 0) return;
  const d = (db.deliveries || []).find(x => x.id === delId);
  if (d) {
    d.bottlesReturned = Math.max(0, parseInt(val) || 0);
    renderStops();
  }
}

async function markStopDelivered(delId) {
  if (selectedDateOffset !== 0) {
    return alert('Deliveries can only be marked on the scheduled day (Today).');
  }

  const d = (db.deliveries || []).find(x => x.id === delId);
  if (!d) return;

  let ratePerBottle = 20;
  if (d.size === 500) ratePerBottle = 10;
  if (d.size === 250) ratePerBottle = 5;

  const totalRebate = (d.bottlesReturned || 0) * ratePerBottle;
  d.status = 'delivered';
  d.bottlesRebate = totalRebate;

  if (d.bottlesReturned > 0) {
    db.bottles = db.bottles || [];
    db.bottles.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      date: d.date,
      customerId: d.customerId,
      customerName: d.customerName,
      size: d.size,
      count: d.bottlesReturned,
      rebate: totalRebate
    });
  }

  save();

  const msg = `Namaste ${d.customerName} ji 🙏\n\nYour milk has been delivered by ${d.agent}!\n\nItem: ${d.product} (${d.size}ml)\nEmpty Bottles Received: ${d.bottlesReturned || 0}\nBottle Rebate Credited: ₹${totalRebate}\n\nPure fresh glass bottle milk. Thank you!\nPanditji Dairy Farm Mamidipally.`;
  window.open(`https://wa.me/91${d.customerPhone}?text=${encodeURIComponent(msg)}`, '_blank');
}

function markStopSkipped(delId) {
  if (selectedDateOffset !== 0) return;
  const d = (db.deliveries || []).find(x => x.id === delId);
  if (!d) return;
  d.status = 'skipped';
  save();
}

function renderStops() {
  if (!currentAgent) return;
  const q = ($('runnerSearch').value || '').toLowerCase().trim();
  const shift = $('shiftFilter').value;
  const targetDate = getTargetDateStr();
  const isToday = selectedDateOffset === 0;

  let stops = (db.deliveries || []).filter(d => d.date === targetDate && d.agent === currentAgent.name);

  if (shift !== 'ALL') {
    stops = stops.filter(d => (d.batch || 'Morning') === shift);
  }

  const totalCount = stops.length;
  const doneCount = stops.filter(d => d.status === 'delivered').length;
  const bottleCount = stops.reduce((sum, d) => sum + (d.bottlesReturned || 0), 0);

  $('statTotal').textContent = totalCount;
  $('statDone').textContent = doneCount;
  $('statBottles').textContent = bottleCount;

  if (q) {
    stops = stops.filter(d => 
      (d.customerName && d.customerName.toLowerCase().includes(q)) ||
      (d.hno && d.hno.toLowerCase().includes(q)) ||
      (d.customerPhone && d.customerPhone.includes(q)) ||
      (d.area && d.area.toLowerCase().includes(q))
    );
  }

  stops.sort((a, b) => (a.status === 'delivered' ? 1 : 0) - (b.status === 'delivered' ? 1 : 0));

  $('agentStopsContainer').innerHTML = stops.map(d => {
    const isDone = d.status === 'delivered';
    const isSkipped = d.status === 'skipped';

    return `
      <div class="card ${isDone ? 'border-l-4 border-emerald-600 bg-emerald-50/25' : isSkipped ? 'border-l-4 border-red-500 bg-red-50/25' : 'border-l-4 border-amber-500'}">
        <div class="flex justify-between items-start">
          <div>
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="bg-[#143525] text-white text-[11px] font-bold px-2 py-0.5 rounded">H.No: ${esc(d.hno)}</span>
              <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-1.5 py-0.5 rounded">📍 ${esc(d.area || 'Local')}</span>
            </div>
            <h3 class="font-bold text-base text-gray-900 mt-1">${esc(d.customerName)}</h3>
            <p class="text-xs text-gray-600">
              📞 <a href="tel:${d.customerPhone}" class="font-bold text-emerald-800 underline">${d.customerPhone}</a>
            </p>
          </div>
          <span class="text-xs font-black px-2.5 py-1 rounded bg-amber-100 text-amber-900 border border-amber-300">
            ${d.size} ml
          </span>
        </div>

        <div class="my-2 p-2 bg-gray-50 rounded-lg text-xs flex justify-between items-center border">
          <span><b>Item:</b> ${esc(d.product)}</span>
          <span class="text-gray-500 font-semibold">${d.batch || 'Morning'}</span>
        </div>

        ${isToday ? (
          !isDone ? `
            <div class="mt-2 pt-2 border-t">
              <div class="flex justify-between items-center mb-1.5">
                <span class="text-xs font-bold text-gray-700">Empty Bottles Collected:</span>
                <span class="text-[11px] text-emerald-800 font-bold">
                  Rebate: ₹${(d.size === 1000 ? 20 : (d.size === 500 ? 10 : 5)) * (d.bottlesReturned || 0)}
                </span>
              </div>
              <div class="flex items-center gap-1.5">
                ${[0, 1, 2, 3, 4].map(n => `
                  <button type="button" class="bubble ${d.bottlesReturned === n ? 'active' : ''}" onclick="setQuickBottles('${d.id}', ${n})">${n}</button>
                `).join('')}
                <input type="number" min="0" value="${d.bottlesReturned || 0}" class="w-14 text-center text-xs py-2 bg-white border border-gray-300 rounded-lg ml-1" placeholder="More" onchange="setManualBottles('${d.id}', this.value)">
              </div>
            </div>

            <div class="mt-3 flex gap-2">
              <button class="btn-deliver flex-1 text-xs" onclick="markStopDelivered('${d.id}')">✓ Mark Delivered</button>
              <button class="bg-gray-100 text-gray-700 font-bold px-3 py-2 rounded-lg text-xs" onclick="markStopSkipped('${d.id}')">Skip</button>
            </div>
          ` : `
            <div class="mt-2 pt-2 border-t flex justify-between items-center text-xs">
              <span class="text-emerald-700 font-bold">✓ Delivered Today</span>
              <span class="text-gray-600 bg-gray-100 px-2 py-0.5 rounded font-semibold">${d.bottlesReturned || 0} bottle(s) returned</span>
            </div>
          `
        ) : `
          <div class="mt-2 pt-2 border-t flex justify-between items-center text-xs bg-gray-50 p-2 rounded">
            <span class="font-bold ${isDone ? 'text-emerald-700' : isSkipped ? 'text-red-600' : 'text-gray-500'}">
              ${isDone ? '✓ Delivered' : isSkipped ? '⚠️ Skipped' : '⏳ Scheduled'}
            </span>
            <span class="text-gray-600 font-semibold">
              ${isDone ? `Bottles received: ${d.bottlesReturned || 0}` : 'No actions permitted'}
            </span>
          </div>
        `}
      </div>
    `;
  }).join('') || `<div class="card text-center py-10 text-gray-400">No scheduled drops for ${currentAgent.name} on ${targetDate}.</div>`;
}

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
}

let sb = null;
function initSupabase() {
  const sbConf = JSON.parse(localStorage.getItem('pjf_supabase_config') || JSON.stringify({ url: DEFAULT_SB_URL, key: DEFAULT_SB_KEY }));
  if (sbConf.url && sbConf.key && window.supabase) {
    sb = window.supabase.createClient(sbConf.url, sbConf.key);
  }
}

async function syncWithCloud(silent = false) {
  if (!sb) initSupabase();
  if (!sb) return;
  try {
    const { data, error } = await sb.from('farm_workspace').select('data').eq('id', 'primary_farm').single();
    if (data && data.data) {
      db = data.data;
      localStorage.setItem('pjf_admin_ops', JSON.stringify(db));
      renderStops();
      if (!silent) alert('Synchronized with farm cloud!');
    }
  } catch(e) {
    console.warn('Sync warning:', e);
  }
}

initSupabase();
checkExistingSession();
</script>
</body>
</html>
