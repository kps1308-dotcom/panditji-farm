<!doctype html>
<html lang="en" class="h-full overflow-x-hidden">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#123826">
  <title>Panditji Dairy | Agent Delivery Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html, body {
      width: 100%; height: 100%; overflow-x: hidden; touch-action: pan-y;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f1; color: #143525;
    }
    .card { background: #ffffff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(20,53,37,0.06); border: 1px solid #dce8e0; width: 100%; box-sizing: border-box; }
    .bubble { border: 1.5px solid #a3c4b0; border-radius: 8px; min-width: 38px; height: 38px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; background: #ffffff; cursor: pointer; user-select: none; }
    .bubble.active { background: #165636; color: #ffffff; border-color: #165636; }
    .tab-btn { flex: 1; padding: 8px; font-size: 12px; font-weight: 700; border-radius: 8px; text-align: center; transition: 0.15s; }
    .tab-btn.active { background: #165636; color: #ffffff; }
    .tab-btn.inactive { background: #e2ebe5; color: #165636; }
  </style>
</head>
<body class="flex flex-col min-h-screen">

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="fixed inset-0 bg-[#123826] z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
    <div class="w-14 h-14 mx-auto rounded-xl bg-emerald-100 flex items-center justify-center font-black text-2xl text-emerald-800 border-2 border-emerald-300">
      PJ
    </div>
    <div>
      <h2 class="text-xl font-bold text-gray-900">Agent Route Login</h2>
      <p class="text-xs text-gray-500 mt-1">Panditji Dairy Farm · Doorstep Delivery App</p>
    </div>

    <form onsubmit="handleAgentLogin(event)" class="space-y-3 text-left">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Mobile Number</label>
        <input type="tel" id="loginPhone" required placeholder="Enter registered mobile" value="9876543210" pattern="[0-9]{10}" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:border-emerald-600 focus:outline-none">
        <p class="text-[10px] text-gray-400 mt-1">Default: 9876543210 / 9876543211 / 9876543212</p>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Passcode / PIN</label>
        <input type="password" id="loginPin" required placeholder="Default: 1234" value="1234" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:border-emerald-600 focus:outline-none text-center font-bold tracking-widest text-lg">
      </div>

      <p id="loginError" class="text-xs text-red-600 font-bold hidden text-center"></p>

      <button type="submit" class="w-full bg-[#165636] hover:bg-[#114028] text-white font-bold py-3 rounded-xl text-sm shadow-md transition active:scale-95">
        Unlock Delivery Route
      </button>
    </form>
  </div>
</div>

<!-- AGENT APP CONTAINER -->
<div id="appContainer" class="hidden flex-1 flex flex-col w-full max-w-md mx-auto">
  <header class="bg-[#123826] text-white px-3.5 py-3 sticky top-0 z-40 shadow-md shrink-0">
    <div class="flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center font-bold text-emerald-300 border border-emerald-400/30 text-xs shrink-0">
          PJ
        </div>
        <div class="min-w-0">
          <h1 class="text-sm font-bold tracking-tight truncate" id="headerAgentName">Agent Runner</h1>
          <p class="text-[10px] text-emerald-200 truncate" id="headerAgentPhone">Logged In</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="syncPullCloud(false)" class="h-8 px-2.5 rounded-lg bg-[#1b4e36] hover:bg-[#236345] text-xs font-semibold flex items-center gap-1">
          <span>🔄</span>
          <span class="text-[10px]" id="syncBtnText">Sync</span>
        </button>
        <button onclick="handleLogout()" class="h-8 px-2.5 rounded-lg bg-red-900/70 hover:bg-red-800 text-red-200 text-xs font-bold">
          Exit
        </button>
      </div>
    </div>

    <!-- Navigation Switcher: Route Stops vs Activity Log -->
    <div class="flex gap-1.5 mt-2.5">
      <button id="navTabStops" class="tab-btn active" onclick="switchView('stops')">🚚 My Route Stops</button>
      <button id="navTabLogs" class="tab-btn inactive" onclick="switchView('logs')">📋 Delivery Time Log</button>
    </div>

    <!-- Date Strip (Shown on Stops View) -->
    <div id="dateNavStrip" class="flex items-center justify-between mt-2.5 pt-2 border-t border-emerald-900/60 text-xs gap-1">
      <button class="bg-[#1b4e36] text-white px-2.5 py-1.5 rounded-lg text-xs font-bold active:scale-95" onclick="changeDateOffset(-1)">
        ◀ Prev
      </button>
      <div class="text-center font-bold text-emerald-100 text-xs truncate px-1" id="currentViewDateLabel">
        Today
      </div>
      <button class="bg-[#1b4e36] text-white px-2.5 py-1.5 rounded-lg text-xs font-bold active:scale-95" onclick="changeDateOffset(1)">
        Next ▶
      </button>
    </div>
  </header>

  <div id="readOnlyNotice" class="hidden px-3 py-1.5 text-xs font-bold text-center border-b shrink-0"></div>

  <!-- VIEW 1: ROUTE STOPS -->
  <main id="stopsView" class="flex-1 p-3 space-y-3 w-full max-w-md mx-auto overflow-y-auto">
    <div class="flex gap-2 w-full">
      <input type="text" id="runnerSearch" placeholder="🔍 Search H.No, Name..." class="flex-1 min-w-0 bg-white border border-gray-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-emerald-600" oninput="renderStops()">
      <select id="shiftFilter" class="bg-white border border-gray-300 rounded-lg px-2 py-2 text-xs font-bold shrink-0" onchange="renderStops()">
        <option value="ALL" selected>All Shifts</option>
        <option value="Morning">Morning</option>
        <option value="Evening">Evening</option>
      </select>
    </div>

    <!-- Quick Stats -->
    <div class="grid grid-cols-3 gap-2 w-full">
      <div class="bg-white p-2 rounded-xl border border-gray-200 text-center">
        <div class="text-[9px] uppercase font-bold text-gray-500">Stops</div>
        <div id="statTotal" class="text-base font-black text-[#143525]">0</div>
      </div>
      <div class="bg-emerald-50 p-2 rounded-xl border border-emerald-200 text-center">
        <div class="text-[9px] uppercase font-bold text-emerald-800">Delivered</div>
        <div id="statDone" class="text-base font-black text-emerald-700">0</div>
      </div>
      <div class="bg-blue-50 p-2 rounded-xl border border-blue-200 text-center">
        <div class="text-[9px] uppercase font-bold text-blue-800">Bottles</div>
        <div id="statBottles" class="text-base font-black text-blue-700">0</div>
      </div>
    </div>

    <!-- Customer Stops List -->
    <div id="agentStopsContainer" class="space-y-3 w-full pb-8"></div>
  </main>

  <!-- VIEW 2: AGENT ACTIVITY & TIMESTAMP LOG -->
  <main id="logsView" class="hidden flex-1 p-3 space-y-3 w-full max-w-md mx-auto overflow-y-auto pb-8">
    <div class="bg-white p-3 rounded-xl border border-gray-200 flex items-center justify-between gap-2">
      <div>
        <h2 class="text-xs font-bold uppercase text-gray-700">Agent Delivery Audit Log</h2>
        <p class="text-[11px] text-gray-500">Exact date, customer stop &amp; timestamp</p>
      </div>
      <input type="date" id="logDateFilter" class="text-xs border border-gray-300 rounded-lg px-2 py-1.5 w-auto" onchange="renderAgentLogs()">
    </div>

    <div id="agentLogsContainer" class="space-y-2.5"></div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);

const getLocalDateString = (offsetDays = 0) => {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
};

const getCurrentTimeStr = () => {
  return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
};

const DEFAULT_SB_URL = 'https://nvqszaywblhdxhlhiuxp.supabase.co';
const DEFAULT_SB_KEY = 'sb_publishable_Pkn8vXc6unUaY2ZPTFf9Rg_LZwu3GDm';

let db = JSON.parse(localStorage.getItem('pjf_admin_ops') || JSON.stringify({
  agents: [
    { id: 'a1', name: 'Agent 1', phone: '9876543210', pin: '1234' },
    { id: 'a2', name: 'Agent 2', phone: '9876543211', pin: '1234' },
    { id: 'a3', name: 'Agent 3', phone: '9876543212', pin: '1234' }
  ],
  deliveries: [],
  bottles: [],
  agentLogs: []
}));

let currentAgent = null;
let selectedDateOffset = 0;
let currentTab = 'stops';
let sb = null;

function initSupabase() {
  if (window.supabase) {
    sb = window.supabase.createClient(DEFAULT_SB_URL, DEFAULT_SB_KEY);
  }
}

function getTargetDateStr() {
  return getLocalDateString(selectedDateOffset);
}

// Helper to flexibly match stops assigned to this agent (by name or phone)
function isStopForCurrentAgent(stop) {
  if (!currentAgent || !stop) return false;
  const stopAgent = String(stop.agent || '').trim().toLowerCase();
  const agName = String(currentAgent.name || '').trim().toLowerCase();
  const agPhone = String(currentAgent.phone || '').trim();
  return stopAgent === agName || stopAgent === agPhone;
}

function checkExistingSession() {
  const saved = localStorage.getItem('pjf_agent_session');
  if (saved) {
    try {
      currentAgent = JSON.parse(saved);
      launchAgentApp();
      return;
    } catch(e) {}
  }
  $('loginScreen').classList.remove('hidden');
  $('appContainer').classList.add('hidden');
}

async function handleAgentLogin(e) {
  e.preventDefault();
  const phone = $('loginPhone').value.trim();
  const pin = $('loginPin').value.trim();
  const errEl = $('loginError');

  // Attempt quick cloud pull first so newly added agents in admin.html are recognized
  await syncPullCloud(true);

  const agentsList = db.agents || [
    { id: 'a1', name: 'Agent 1', phone: '9876543210', pin: '1234' },
    { id: 'a2', name: 'Agent 2', phone: '9876543211', pin: '1234' },
    { id: 'a3', name: 'Agent 3', phone: '9876543212', pin: '1234' }
  ];

  let match = agentsList.find(a => String(a.phone).trim() === phone);

  if (!match) {
    if (phone === '9876543210') match = { id: 'a1', name: 'Agent 1', phone: phone, pin: '1234' };
    else if (phone === '9876543211') match = { id: 'a2', name: 'Agent 2', phone: phone, pin: '1234' };
    else if (phone === '9876543212') match = { id: 'a3', name: 'Agent 3', phone: phone, pin: '1234' };
  }

  if (!match) {
    errEl.textContent = 'Mobile number not found. Ask Admin to register your number.';
    errEl.classList.remove('hidden');
    return;
  }

  const expectedPin = String(match.pin || '1234').trim();
  if (pin !== expectedPin && pin !== '1234') {
    errEl.textContent = 'Incorrect PIN! Default is 1234.';
    errEl.classList.remove('hidden');
    return;
  }

  currentAgent = match;
  localStorage.setItem('pjf_agent_session', JSON.stringify(currentAgent));
  launchAgentApp();
}

function handleLogout() {
  if (confirm('Log out from Agent Portal?')) {
    localStorage.removeItem('pjf_agent_session');
    currentAgent = null;
    $('loginScreen').classList.remove('hidden');
    $('appContainer').classList.add('hidden');
  }
}

async function launchAgentApp() {
  $('loginScreen').classList.add('hidden');
  $('appContainer').classList.remove('hidden');
  $('headerAgentName').textContent = currentAgent.name;
  $('headerAgentPhone').textContent = `📞 ${currentAgent.phone}`;
  $('logDateFilter').value = getLocalDateString(0);
  selectedDateOffset = 0;
  updateDateHeader();
  renderStops();
  await syncPullCloud(true);
}

function switchView(tab) {
  currentTab = tab;
  if (tab === 'stops') {
    $('stopsView').classList.remove('hidden');
    $('logsView').classList.add('hidden');
    $('dateNavStrip').classList.remove('hidden');
    $('navTabStops').className = 'tab-btn active';
    $('navTabLogs').className = 'tab-btn inactive';
    updateDateHeader();
    renderStops();
  } else {
    $('stopsView').classList.add('hidden');
    $('logsView').classList.remove('hidden');
    $('dateNavStrip').classList.add('hidden');
    $('readOnlyNotice').classList.add('hidden');
    $('navTabStops').className = 'tab-btn inactive';
    $('navTabLogs').className = 'tab-btn active';
    renderAgentLogs();
  }
}

function changeDateOffset(delta) {
  selectedDateOffset += delta;
  updateDateHeader();
  renderStops();
}

function updateDateHeader() {
  const targetDate = getTargetDateStr();
  const d = new Date(targetDate + 'T00:00:00');
  const dateFormatted = d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  const notice = $('readOnlyNotice');

  if (selectedDateOffset === 0) {
    $('currentViewDateLabel').innerHTML = `📅 Today (${dateFormatted})`;
    notice.classList.add('hidden');
  } else if (selectedDateOffset < 0) {
    const daysAgo = Math.abs(selectedDateOffset);
    $('currentViewDateLabel').innerHTML = `⏪ ${daysAgo === 1 ? 'Yesterday' : daysAgo + 'd ago'} (${dateFormatted})`;
    notice.className = 'px-3 py-1.5 text-[11px] font-bold text-center bg-gray-200 text-gray-700 border-b border-gray-300';
    notice.textContent = '🔒 Viewing Past Record (Read-Only Mode)';
    notice.classList.remove('hidden');
  } else {
    const daysAhead = selectedDateOffset;
    $('currentViewDateLabel').innerHTML = `⏩ In ${daysAhead}d (${dateFormatted})`;
    notice.className = 'px-3 py-1.5 text-[11px] font-bold text-center bg-amber-100 text-amber-900 border-b border-amber-300';
    notice.textContent = '⏳ Upcoming Preview (Read-Only)';
    notice.classList.remove('hidden');
  }
}

function setQuickBottles(delId, count) {
  if (selectedDateOffset !== 0) return;
  const d = (db.deliveries || []).find(x => String(x.id) === String(delId));
  if (d) {
    d.bottlesReturned = Number(count);
    localStorage.setItem('pjf_admin_ops', JSON.stringify(db));
    renderStops();
  }
}

function setManualBottles(delId, val) {
  if (selectedDateOffset !== 0) return;
  const d = (db.deliveries || []).find(x => String(x.id) === String(delId));
  if (d) {
    d.bottlesReturned = Math.max(0, parseInt(val) || 0);
    localStorage.setItem('pjf_admin_ops', JSON.stringify(db));
    renderStops();
  }
}

// Mark Stop Delivered + Record Exact Timestamp & Audit Log
async function markStopDelivered(delId) {
  if (selectedDateOffset !== 0) {
    alert('Deliveries can only be completed on Today\'s route.');
    return;
  }

  const d = (db.deliveries || []).find(x => String(x.id) === String(delId));
  if (!d) {
    alert('Stop record not found. Tap Sync and try again.');
    return;
  }

  let ratePerBottle = 20;
  if (Number(d.size) === 500) ratePerBottle = 10;
  if (Number(d.size) === 250) ratePerBottle = 5;

  const returnedCount = Number(d.bottlesReturned) || 0;
  const totalRebate = returnedCount * ratePerBottle;
  const exactTime = getCurrentTimeStr();

  d.status = 'delivered';
  d.bottlesReturned = returnedCount;
  d.bottlesRebate = totalRebate;
  d.deliveredAt = exactTime;
  d.deliveredBy = currentAgent.name;

  // Record in Bottle Ledger
  if (returnedCount > 0) {
    db.bottles = db.bottles || [];
    db.bottles.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      date: d.date,
      customerId: d.customerId,
      customerName: d.customerName,
      size: d.size,
      count: returnedCount,
      rebate: totalRebate
    });
  }

  // Record in Agent Activity Audit Log (Day, Stop, Exact Time)
  db.agentLogs = db.agentLogs || [];
  db.agentLogs.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    date: d.date,
    time: exactTime,
    agentName: currentAgent.name,
    agentPhone: currentAgent.phone,
    customerName: d.customerName,
    hno: d.hno,
    area: d.area || 'Local',
    size: d.size,
    bottlesReturned: returnedCount,
    action: 'Delivered'
  });

  // 1. Save Locally & Re-render immediately
  localStorage.setItem('pjf_admin_ops', JSON.stringify(db));
  renderStops();

  // 2. Push upstream to Supabase Cloud
  await syncPushCloud();

  // 3. Optional WhatsApp confirmation
  const msg = `Namaste ${d.customerName} ji 🙏\n\nYour milk has been delivered by ${currentAgent.name} at ${exactTime}!\n\nItem: ${d.product} (${d.size}ml)\nEmpty Bottles Received: ${returnedCount}\nBottle Rebate: ₹${totalRebate}\n\nThank you! Panditji Dairy Farm.`;
  try {
    window.open(`https://wa.me/91${d.customerPhone}?text=${encodeURIComponent(msg)}`, '_blank');
  } catch(e) {}
}

async function markStopSkipped(delId) {
  if (selectedDateOffset !== 0) return;
  const d = (db.deliveries || []).find(x => String(x.id) === String(delId));
  if (!d) return;

  const exactTime = getCurrentTimeStr();
  d.status = 'skipped';
  d.deliveredAt = exactTime;

  db.agentLogs = db.agentLogs || [];
  db.agentLogs.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    date: d.date,
    time: exactTime,
    agentName: currentAgent.name,
    agentPhone: currentAgent.phone,
    customerName: d.customerName,
    hno: d.hno,
    area: d.area || 'Local',
    size: d.size,
    bottlesReturned: 0,
    action: 'Skipped'
  });

  localStorage.setItem('pjf_admin_ops', JSON.stringify(db));
  renderStops();
  await syncPushCloud();
}

function renderStops() {
  if (!currentAgent) return;
  const q = ($('runnerSearch').value || '').toLowerCase().trim();
  const shift = $('shiftFilter').value;
  const targetDate = getTargetDateStr();
  const isToday = (selectedDateOffset === 0);

  let stops = (db.deliveries || []).filter(d => String(d.date) === String(targetDate) && isStopForCurrentAgent(d));

  if (shift !== 'ALL') {
    stops = stops.filter(d => (d.batch || 'Morning') === shift);
  }

  const totalCount = stops.length;
  const doneCount = stops.filter(d => d.status === 'delivered').length;
  const bottleCount = stops.reduce((sum, d) => sum + (Number(d.bottlesReturned) || 0), 0);

  $('statTotal').textContent = totalCount;
  $('statDone').textContent = doneCount;
  $('statBottles').textContent = bottleCount;

  if (q) {
    stops = stops.filter(d => 
      (d.customerName && d.customerName.toLowerCase().includes(q)) ||
      (d.hno && d.hno.toLowerCase().includes(q)) ||
      (d.customerPhone && d.customerPhone.includes(q)) ||
      (d.area && d.area.toLowerCase().includes(q))
    );
  }

  stops.sort((a, b) => (a.status === 'delivered' ? 1 : 0) - (b.status === 'delivered' ? 1 : 0));

  $('agentStopsContainer').innerHTML = stops.map(d => {
    const isDone = (d.status === 'delivered');
    const isSkipped = (d.status === 'skipped');

    return `
      <div class="card ${isDone ? 'border-l-4 border-emerald-600 bg-emerald-50/30' : isSkipped ? 'border-l-4 border-red-500 bg-red-50/30' : 'border-l-4 border-amber-500'}">
        <div class="flex justify-between items-start gap-2">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="bg-[#143525] text-white text-[10px] font-bold px-2 py-0.5 rounded truncate max-w-[140px]">H.No: ${esc(d.hno)}</span>
              <span class="bg-emerald-100 text-emerald-900 text-[10px] font-bold px-1.5 py-0.5 rounded truncate max-w-[120px]">📍 ${esc(d.area || 'Local')}</span>
            </div>
            <h3 class="font-bold text-sm text-gray-900 mt-1 break-words">${esc(d.customerName)}</h3>
            <p class="text-xs text-gray-600 mt-0.5">
              📞 <a href="tel:${d.customerPhone}" class="font-bold text-emerald-800 underline">${d.customerPhone}</a>
            </p>
          </div>
          <span class="text-xs font-black px-2 py-0.5 rounded bg-amber-100 text-amber-900 border border-amber-300 shrink-0">
            ${d.size} ml
          </span>
        </div>

        <div class="my-2 p-2 bg-gray-50 rounded-lg text-xs flex justify-between items-center border">
          <span class="truncate pr-1"><b>Item:</b> ${esc(d.product)}</span>
          <span class="text-gray-500 font-semibold shrink-0">${d.batch || 'Morning'}</span>
        </div>

        ${isToday ? (
          !isDone ? `
            <div class="mt-2 pt-2 border-t">
              <div class="flex justify-between items-center mb-1 text-xs">
                <span class="font-bold text-gray-700 text-[11px]">Empty Bottles Received:</span>
                <span class="text-[11px] text-emerald-800 font-bold">
                  Rebate: ₹${(Number(d.size) === 1000 ? 20 : (Number(d.size) === 500 ? 10 : 5)) * (Number(d.bottlesReturned) || 0)}
                </span>
              </div>
              <div class="grid grid-cols-6 gap-1 w-full">
                ${[0, 1, 2, 3, 4].map(n => `
                  <button type="button" class="bubble ${Number(d.bottlesReturned) === n ? 'active' : ''}" onclick="setQuickBottles('${d.id}', ${n})">${n}</button>
                `).join('')}
                <input type="number" min="0" value="${d.bottlesReturned || 0}" class="w-full text-center text-xs bg-white border border-gray-300 rounded-lg" placeholder="+" onchange="setManualBottles('${d.id}', this.value)">
              </div>
            </div>

            <div class="mt-3 flex gap-2 w-full">
              <button class="bg-[#165636] hover:bg-[#10432a] text-white font-bold py-2.5 px-3 rounded-lg text-xs flex-1 transition active:scale-95" onclick="markStopDelivered('${d.id}')">
                ✓ Mark Delivered
              </button>
              <button class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-3 py-2.5 rounded-lg text-xs shrink-0" onclick="markStopSkipped('${d.id}')">
                Skip
              </button>
            </div>
          ` : `
            <div class="mt-2 pt-2 border-t flex justify-between items-center text-xs">
              <div>
                <span class="text-emerald-700 font-bold block">✓ Delivered at ${esc(d.deliveredAt || 'Today')}</span>
              </div>
              <span class="text-gray-600 bg-gray-100 px-2 py-0.5 rounded font-semibold">${d.bottlesReturned || 0} bottle(s) recd</span>
            </div>
          `
        ) : `
          <div class="mt-2 pt-2 border-t flex justify-between items-center text-xs bg-gray-50 p-1.5 rounded">
            <span class="font-bold ${isDone ? 'text-emerald-700' : isSkipped ? 'text-red-600' : 'text-gray-500'}">
              ${isDone ? `✓ Delivered (${esc(d.deliveredAt || '')})` : isSkipped ? '⚠️ Skipped' : '⏳ Scheduled'}
            </span>
            <span class="text-gray-600 font-semibold text-[11px]">
              ${isDone ? `Bottles: ${d.bottlesReturned || 0}` : 'Locked view'}
            </span>
          </div>
        `}
      </div>
    `;
  }).join('') || `<div class="card text-center py-8 text-gray-400 text-xs">No scheduled drops for ${currentAgent.name} on ${targetDate}.<br><button onclick="syncPullCloud(false)" class="mt-2 text-emerald-700 font-bold underline">Tap to Refresh Cloud</button></div>`;
}

// Render Agent Activity & Timestamp Log
function renderAgentLogs() {
  if (!currentAgent) return;
  const filterDate = $('logDateFilter').value;

  // Combine explicit agentLogs and any deliveries with timestamps for this agent
  let logs = (db.agentLogs || []).filter(l => 
    String(l.agentName || '').trim().toLowerCase() === String(currentAgent.name).trim().toLowerCase() ||
    String(l.agentPhone || '').trim() === String(currentAgent.phone).trim()
  );

  // Backfill from deliveries if agentLogs is empty
  if (logs.length === 0) {
    logs = (db.deliveries || [])
      .filter(d => isStopForCurrentAgent(d) && (d.status === 'delivered' || d.status === 'skipped'))
      .map(d => ({
        date: d.date,
        time: d.deliveredAt || 'Recorded',
        customerName: d.customerName,
        hno: d.hno,
        area: d.area || 'Local',
        size: d.size,
        bottlesReturned: d.bottlesReturned || 0,
        action: d.status === 'delivered' ? 'Delivered' : 'Skipped'
      }));
  }

  if (filterDate) {
    logs = logs.filter(l => String(l.date) === String(filterDate));
  }

  $('agentLogsContainer').innerHTML = logs.slice().reverse().map(l => `
    <div class="card border-l-4 ${l.action === 'Delivered' ? 'border-emerald-600' : 'border-red-500'} text-xs space-y-1">
      <div class="flex justify-between items-center">
        <span class="font-bold text-gray-900">${esc(l.hno)} · ${esc(l.customerName)}</span>
        <span class="font-mono text-[11px] font-bold px-2 py-0.5 rounded bg-gray-100 text-gray-800">
          🕒 ${esc(l.time)}
        </span>
      </div>
      <div class="flex justify-between items-center text-gray-600 text-[11px]">
        <span>📅 ${esc(l.date)} · 📍 ${esc(l.area)} (${l.size}ml)</span>
        <span class="font-bold ${l.action === 'Delivered' ? 'text-emerald-700' : 'text-red-600'}">
          ${l.action} (${l.bottlesReturned} empty)
        </span>
      </div>
    </div>
  `).join('') || `<div class="card text-center py-8 text-gray-400 text-xs">No delivery activity logged for this date.</div>`;
}

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
}

// Push to Supabase Cloud
async function syncPushCloud() {
  if (!sb) initSupabase();
  if (!sb) return;
  try {
    $('syncBtnText').textContent = 'Saving...';
    await sb.from('farm_workspace').upsert({ id: 'primary_farm', data: db, updated_at: new Date() });
    $('syncBtnText').textContent = 'Saved ✓';
    setTimeout(() => { if ($('syncBtnText')) $('syncBtnText').textContent = 'Sync'; }, 2000);
  } catch(e) {
    console.warn('Push error:', e);
    $('syncBtnText').textContent = 'Sync';
  }
}

// Pull from Supabase Cloud without erasing local deliveries if cloud is empty
async function syncPullCloud(silent = false) {
  if (!sb) initSupabase();
  if (!sb) return;
  try {
    $('syncBtnText').textContent = '...';
    const { data } = await sb.from('farm_workspace').select('data').eq('id', 'primary_farm').single();
    if (data && data.data) {
      // Only overwrite if cloud actually has records
      if ((data.data.deliveries && data.data.deliveries.length > 0) || (data.data.agents && data.data.agents.length > 0)) {
        db = data.data;
        localStorage.setItem('pjf_admin_ops', JSON.stringify(db));
        if (currentTab === 'stops') renderStops();
        else renderAgentLogs();
      }
      if (!silent) alert('Synced with live dairy records!');
    }
    $('syncBtnText').textContent = 'Sync';
  } catch(e) {
    console.warn('Pull error:', e);
    $('syncBtnText').textContent = 'Sync';
  }
}

initSupabase();
checkExistingSession();
</script>
</body>
